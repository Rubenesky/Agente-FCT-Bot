name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        env:
          # config.py exige estas variables con os.environ[...] nada más
          # importarse (fail-fast intencionado en producción). Los tests
          # mockean todas las llamadas externas, así que no hace falta
          # ningún valor real aquí - solo que la variable exista.
          ADZUNA_APP_ID: test-adzuna-app-id
          ADZUNA_API_KEY: test-adzuna-api-key
          TELEGRAM_BOT_TOKEN: test-telegram-bot-token
          TELEGRAM_CHAT_ID: "000000000"
          GROQ_API_KEY: test-groq-api-key
        run: pytest
